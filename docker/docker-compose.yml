version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  odoo:
    image: odoo:17.0
    depends_on: [db]
    ports: ["8069:8069"]
    volumes:
      - ../addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

volumes:
  pgdata:
